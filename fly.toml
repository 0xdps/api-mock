# fly.toml app configuration file generated for api-mockly on 2025-11-20T13:35:07+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'api-mockly'
primary_region = 'bom'

[build]
  dockerfile = "Dockerfile"

[env]
  # Cache Configuration
  # Mode options: off (no caching), local (in-memory only), remote (Redis only), all (both - DEFAULT)
  CACHE_MODE = "all"
  CACHE_ITEMS_PER_RESOURCE = "100"
  CACHE_SEED = "42"
  MAX_ITEMS_PER_RESOURCE = "1000"
  
  # Redis Configuration (Upstash)
  # Using Upstash Redis WITHOUT TLS connection
  REDIS_HOST = "fly-cache-mockly.upstash.io"
  REDIS_PORT = "6379"
  REDIS_DB = "0"
  REDIS_TLS_ENABLED = "false"
  # Note: Set REDIS_PASSWORD as a Fly secret (not in this file)
  # Run: fly secrets set REDIS_PASSWORD="your_upstash_token"
  
  # Server Configuration
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

