name: Build and Test

on:
  push:
    branches: [trunk, develop, main]
  pull_request:
    branches: [trunk, develop, main]

jobs:
  generate-types:
    name: Generate TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Types
        run: pnpm run generate-types

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain frontend/types/api.ts)" ]; then
            echo "::error::TypeScript types are out of date. Run 'pnpm run generate-types' locally and commit the changes."
            exit 1
          fi

  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: generate-types
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Schemas to Backend
        run: pnpm run generate-types

      - name: Build Backend
        run: cd backend && go build -o bin/server ./cmd/server

      - name: Run Tests
        run: cd backend && go test ./internal/... -v -race -coverprofile=coverage.out -skip="TestCache_MixedConcurrentOperations"

      - name: Display Test Coverage
        run: cd backend && go tool cover -func=coverage.out

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: generate-types
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Types
        run: pnpm run generate-types

      - name: Type Check
        run: pnpm --filter @api-mockly/frontend type-check

      - name: Build
        run: pnpm --filter @api-mockly/frontend build
