name: Build and Test

on:
  push:
    branches: [ trunk, develop ]
  pull_request:
    branches: [ trunk, develop ]

jobs:
  generate-types:
    name: Generate TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Generate Types
        run: npm run generate-types
      
      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain frontend/types/api.ts)" ]; then
            echo "::error::TypeScript types are out of date. Run 'npm run generate-types'"
            exit 1
          fi

  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    needs: generate-types
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      
      - name: Copy Schemas to Backend (for build verification)
        run: |
          mkdir -p backend/internal/schema/embedded
          cp shared/schemas/*/*.json backend/internal/schema/embedded/
      
      - name: Build Backend
        run: cd backend && go build -o bin/server ./cmd/server
      
      - name: Run Tests
        run: cd backend && go test ./internal/... -v -race -coverprofile=coverage.out -skip="TestCache_MixedConcurrentOperations"
      
      - name: Display Test Coverage
        run: cd backend && go tool cover -func=coverage.out

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: generate-types
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Generate Types
        run: npm run generate-types
      
      - name: Install Dependencies
        run: cd frontend && npm ci
      
      - name: Type Check
        run: cd frontend && npm run type-check
      
      - name: Build
        run: cd frontend && npm run build

