# Railway Configuration for API Mockly Backend
# https://docs.railway.app/deploy/config-as-code

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "./server"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
  
